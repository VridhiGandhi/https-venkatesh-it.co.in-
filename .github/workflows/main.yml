name: Deploy WordPress to GoDaddy via rsync
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Synchronize Files with GoDaddy WordPress Hosting Server
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: "1288214.us19.myftpupload.com"
          ssh_user: "git_deployer_a3e8f70bda_1288214"
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          deployment_dest: "wp-content/themes/vits"
